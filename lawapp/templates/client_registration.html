	  <div class="row no-gutters">
								<div class="col-md-7">
									<div class="contact-wrap w-100 p-md-5 p-4">
										<div style="color:red">{{msg}}</div>
										<h3 class="mb-4">Client Registration</h3>
										<form method="POST" action="{% url 'client_reg' %}" id="contactForm" name="contactForm" class="contactForm" enctype="multipart/form-data">
											<div class="row">
												<div class="col-md-6">
													{% csrf_token %}
													<div class="form-group">
														<label class="label" for="name">Full Name</label>
														<input type="text" class="form-control" name="full_name" id="name" placeholder="Name" required>
													</div>
												</div>
												<div class="col-md-6">
													<div class="form-group">
														<label class="label" for="email">Email </label>
														<input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
													</div>
												</div>
												<div class="col-md-6">
													<div class="form-group">
														<label class="label" for="password">Password</label>
														<input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
													</div>
												</div>
												<div class="col-md-6">
													<div class="form-group">
														<label class="label" for="mobile">mobile </label>
<input type="text" class="form-control" name="mobile" id="mobile" placeholder="Mobile"
       required pattern="[6-9]\d{9}" maxlength="10" title="Enter a valid 10-digit mobile number starting with 6, 7, 8, or 9">
													</div>
												</div>

												<div class="col-md-6">
													<div class="form-group">
														<label class="label" for="city">City </label>
														 <select name="city" class="form-control" id="city" required>
														  <option  value="">Select city</option>
														  <option value="Hyderabad">Hyderabad</option>
														  <option value="Kerala">Kerala</option>
														  <option value="Banglore">Banglore</option>
															<option value="Pune">Pune</option>

															<option value="vijayawada">vijayawada</option>
														  </select>
													</div>
												</div>
<div class="col-md-6">
													<div class="form-group">
														<label class="label" >Photo: </label>
                                                        <input type="file" id="image" name="cimage" class="form-control" required>
													</div>
												</div>

												<div class="col-md-12">
													<div class="form-group">
														<label class="label" for="Address">Address</label>
														<textarea name="address" class="form-control" id="Address" cols="30" rows="4" placeholder="Address...." required></textarea>
													</div>

												</div>
												<div class="col-md-12">
													<div class="form-group">
														<input type="submit" value="Register" class="btn btn-primary">
														<div class="submitting"></div>
													</div>
												</div>
											</div>
										</form>
									</div>
								</div>

							</div>
