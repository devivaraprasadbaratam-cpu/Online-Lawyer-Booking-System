{% include 'header.html'%}
{% load static %}

  <body>


    
	  <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
	    <div class="container">
	      <a class="navbar-brand" href="#">ONLINE LAWYER BOOKING SYSTEM</a>
	      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
	        <span class="oi oi-menu"></span> Menu
	      </button>

	      <div class="collapse navbar-collapse" id="ftco-nav">

	        <ul class="navbar-nav ml-auto">
	          <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
	          <li class="nav-item"><a href="{% url 'about' %}" class="nav-link">About</a></li>
<!--				<li class="nav-item"><a href="{% url 'attorney' %}" class="nav-link">Attorneys</a></li>-->
	          <li class="nav-item active"><a href="{% url 'contact' %}" class="nav-link">Contact</a></li>
				<li class="nav-item"><a href="{% url 'lawyer_login' %}" class="nav-link">Lawyers</a></li>
	          <li class="nav-item"><a href="{% url 'client_login' %}" class="nav-link">Client</a></li>
				<li class="nav-item"><a href="{% url 'admin_login' %}" class="nav-link">Admin</a></li>
	        </ul>
	      </div>
	    </div>
	  </nav>
    <!-- END nav -->
    
    <section class="hero-wrap hero-wrap-2" style="background-image: url({% static 'images/bg_5.jpg' %});" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-end justify-content-center">
          <div class="col-md-9 ftco-animate mb-5 text-center">
<!--          	<p class="breadcrumbs mb-0"><span class="mr-2"><a href="/">Home <i class="fa fa-chevron-right"></i></a></span>Contact <span><i class="fa fa-chevron-right"></i></span></p>-->
            <h1 class="mb-0 bread">Contact Us</h1>
          </div>
        </div>
      </div>
    </section>

    <section class="ftco-section bg-light">
			<div class="container">
				<div class="row justify-content-center">
					<div class="col-md-12">
						<div class="wrapper px-md-4">
							<div class="row mb-5">
								<div class="col-md-3">

				        		<div class="text">
<!--					            <p><span>Address:</span> 198 West 21th Street, Suite 721 New York NY 10016</p>-->

					          </div>
				          </div>
								</div>
								<div class="col-md-3">
									<div class="dbox w-100 text-center">

				          </div>
								</div>

							<div class="row no-gutters">
								<div class="col-md-7">

									<div class="contact-wrap w-100 p-md-5 p-4">
                            <div style="color:green">{{msg}}</div>
										<h3 class="mb-4">Contact Us</h3>
										<form method="POST" action="{% url 'contact' %}" id="contactForm" name="contactForm" class="contactForm">
											<div class="row">
												<div class="col-md-6">
													{% csrf_token %}
													<div class="form-group">
														<label class="label" for="name">Full Name</label>
														<input type="text" class="form-control" name="full_name" id="name" placeholder="Name" required>
													</div>
												</div>
												<div class="col-md-6"> 
													<div class="form-group">
														<label class="label" for="email">Email Address</label>
														<input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
													</div>
												</div>
												<div class="col-md-12">
													<div class="form-group">
														<label class="label" for="subject">Subject</label>
														<input type="text" class="form-control" name="subject" id="subject" placeholder="Subject" required>
													</div>
												</div>
												<div class="col-md-12">
													<div class="form-group">
														<label class="label" for="message">Message</label>
														<textarea name="message" class="form-control" id="message" cols="30" rows="4" placeholder="Message" required></textarea>
													</div>
												</div>
												<div class="col-md-12">
													<div class="form-group">
														<input type="submit" value="Send Message" class="btn btn-primary">
														<div class="submitting"></div>

													</div>
												</div>
											</div>
										</form>
									</div>
								</div>

							</div>
						</div>
					</div>
				</div>
			</div>
		</section>

    {% include 'footer.html' %}
  </body>
</html>
