  <section class="hero-wrap hero-wrap-2" style="background-image: url({% static 'images/c_home.jpg' %});" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-end justify-content-center">
          <div class="col-md-9 ftco-animate mb-5 text-center">
<!--          	<p class="breadcrumbs mb-0"><span class="mr-2"><a href="/">Home <i class="fa fa-chevron-right"></i></a></span>Lawyer <span><i class="fa fa-chevron-right"></i></span></p>-->
            <h1 class="mb-0 bread">Lawyer Registration</h1>
          </div>
        </div>
      </div>
    </section>

	  <div class="row no-gutters">
								<div class="col-md-7">
									<div class="contact-wrap w-100 p-md-5 p-4">
										<h6 style="color:red">{{msg}}</h6>
										<h3 class="mb-4">Lawyer Registration</h3>
										<form method="POST" action="{% url 'lawyer_reg' %}" id="contactForm" name="contactForm" class="contactForm" enctype="multipart/form-data">
											<div class="row">
												{% csrf_token %}
												<div class="col-md-8">
													<div class=" ">
														<label class="label" for="suffix"></label>
														 <select name="suffix" id="suffix" class="form-control" required>
															<option value="Mr.">Mr.</option>
															<option value="Ms.">Ms.</option>
															<option value="Dr.">Dr.</option>
															<option value="Mrs.">Mrs.</option>
															<option value="Miss.">Miss.</option>
														  </select>
														 </div>
													</div>

													<div class="col-md-8">
													<div class="form-group">
														<label class="label" for="name">Full Name</label>
														<input type="text" class="form-control" name="full_name" id="name" placeholder="Name" required>
													</div>
												</div>

												<div class="col-md-8">
													<div class="form-group">
														<label class="label" for="email">Email </label>
														<input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
													</div>
												</div>

												<div class="col-md-8">
													<div class="form-group">
														<label class="label" for="password">Password</label>
														<input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
													</div>
												</div>

												<div class="col-md-8">
													<div class="form-group">
														<label class="label" for="mobile">mobile </label>
                                       <input type="text" class="form-control" name="mobile" id="mobile" placeholder="Mobile"
                                       required pattern="[6-9]\d{9}" maxlength="10" title="Enter a valid 10-digit mobile number starting with 6, 7, 8, or 9">
													</div>
												</div>

													<div class="col-md-8">
														<div class="form-group">
														<label class="label" for="city">City </label>
														 <select name="city" id="city" class="form-control" required>
														  <option  value="">Select City</option>
														  <option value="Hyderabad">Hyderabad</option>
														  <option value="Kerala">Kerala</option>
														  <option value="Banglore">Banglore</option>
															<option value="Pune">Pune</option>
															<option value="Vijayawada">Vijayawada</option>
														  </select>
													</div></div>



													<div class="col-md-8">
													<div class="form-group">
														<label class="label" for="Specialization">Specialization: </label>
														 <select name="specialization" id="Specialization" class="form-control" required>
														  <option  value="">Select Specialization</option>
														  <option value="Family Law">Family Law</option>
														  <option value="Criminal Law">Criminal Law</option>
														  <option value="Banking and Finance Law">Banking and Finance Law</option>
															<option value="Corporate Law">Corporate Law</option>
															<option value="Employment and Labor Law">Employment and Labor Law</option>
															<option value="Tort Law">Tort Law</option>
															<option value="Real Estate Law">Real Estate Law</option>
														  </select>
													</div>
												</div>


                                            <div class="col-md-8">
													<div class="form-group">
														<label class="label" for="experience">Experience: </label>
                                                        <textarea  class="form-control" name="experience" id="experience" placeholder="Experience" required></textarea>
													</div>
												</div>

                                            <div class="col-md-8">
													<div class="form-group">
														<label class="label" for="current">currently working as: </label>
                                                        <textarea  class="form-control" name="current" id="current" placeholder="Currently Working As" required></textarea>
													</div>
												</div>
                                            <div class="col-md-8">
													<div class="form-group">
														<label class="label" for="photo">Photo: </label>
                                                        <input type="file" id="photo" name="image" class="form-control" required>
													</div>
												</div>

												<div class="col-md-12">
													<div class="form-group">
														<input type="submit" value="Register" class="btn btn-primary">
														<div class="submitting"></div>
													</div>
												</div></div>
										</form>
									</div>
								</div>

							</div>
